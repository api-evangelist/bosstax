aid: bosstax
name: BossTax
description: BossTax is a mobile bookkeeping and tax-filing app for 1099 workers, freelancers,
  and independent contractors. Founded in 2022 and based in Stamford, Connecticut, BossTax
  lets self-employed users track expenses by photographing receipts, automatically categorize
  deductions, log expenses hands-free by voice, manage separate business banking, and file
  federal, state, and local taxes with a licensed tax professional for a single flat fee with
  no subscriptions. BossTax is an IRS-authorized Electronic Return Originator (ERO) and is
  backed by Bloomberg Beta and Boyd Street Ventures. The company ships iOS and Android consumer
  apps; it publishes no public developer API, documentation, or SDK surface at this time, so this
  profile tracks the company identity and public web properties in the API Evangelist network.
